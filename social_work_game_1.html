    // Audio Synthesizer for SFX & Atmosphere
    class SoundEngine {
        constructor() {
            this.ctx = null;
        }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playTone(freq, type, duration, vol = 0.1) {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e) {}
        }
        playChoiceSFX() {
            this.playTone(440, 'sine', 0.12, 0.08);
            setTimeout(() => this.playTone(554.37, 'sine', 0.15, 0.08), 60);
        }
        playPositiveSFX() {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.1), i * 90);
            });
        }
        playCareSFX() {
            this.playTone(349.23, 'sine', 0.2, 0.12);
            setTimeout(() => this.playTone(440.00, 'sine', 0.3, 0.1), 120);
        }
    }

    function renderScene(sceneId) {
        if (sceneId === 'restart') {
            gameState.empathy = 100;
            gameState.trust = 0;
            sceneId = 'start';
        }

        gameState.currentSceneId = sceneId;
        const node = STORY_NODES[sceneId];
        if (!node) return;

        // UI Updates
        document.getElementById('current-location').innerText = node.location;
        document.getElementById('speaker-avatar').innerText = node.avatar;
        document.getElementById('speaker-name').innerText = node.speaker;
        document.getElementById('speaker-title').innerText = node.title;

        // Scene Background update
        const bgEl = document.getElementById('scene-bg');
        bgEl.style.backgroundImage = `url('${node.bg}')`;

        // Narrative text rendering
        const narrativeContainer = document.getElementById('narrative-text');
        narrativeContainer.innerHTML = node.text.map(p => `<p class="leading-relaxed bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">${p}</p>`).join('');

        // Choices rendering
        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';

        node.choices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = "choice-btn w-full p-3.5 bg-slate-900 hover:bg-slate-800 active:bg-pink-950/40 text-left text-xs sm:text-sm font-semibold text-slate-100 rounded-2xl border border-slate-700/80 hover:border-pink-500/50 flex items-center justify-between gap-2 shadow-md";
            
            btn.innerHTML = `
                <span class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-pink-500/20 text-pink-300 text-xs flex items-center justify-center font-bold border border-pink-500/30 shrink-0">${index + 1}</span>
                    <span>${choice.text}</span>
                </span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-500 shrink-0"></i>
            `;

            btn.onclick = () => {
                sound.playChoiceSFX();
                
                // Update Stats
                gameState.empathy = Math.min(100, Math.max(0, gameState.empathy + (choice.empathyDelta || 0)));
                gameState.trust += (choice.trustDelta || 0);

                document.getElementById('stat-empathy').innerText = gameState.empathy;
                document.getElementById('stat-trust').innerText = gameState.trust;

                if (choice.trustDelta > 0) {
                    sound.playPositiveSFX();
                }

                renderScene(choice.next);
            };

            choicesContainer.appendChild(btn);
        });
    }

    window.onload = function() {
        const modal = document.getElementById('modal-screen');
        const btnStart = document.getElementById('btn-start-game');

        btnStart.onclick = () => {
            sound.init();
            sound.playCareSFX();
            modal.classList.add('hidden');
            renderScene('start');
        };
    };
    </script>
